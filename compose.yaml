name: agentic-factory
x-podman:
  in_pod: false
services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    restart: unless-stopped
    command: ["-f", "/config.yaml"]
    ports:
      - "127.0.0.1:4000:4000" # expose the gateway
      - "127.0.0.1:4001:4001" # expose the UI
    volumes:
      - ./gateway/config.yaml:/config.yaml:ro
      - agentgateway-data:/data
    env_file:
      - ./secrets/gateway.env
    networks:
      - pi-control
      - pi-backend
    security_opt:
      - no-new-privileges:true
  mcp-memory:
    image: ghcr.io/basicmachines-co/basic-memory:1.0.0@sha256:cad49f5433bcd8592fea547907a2b967435b3fa60d0f81ebc4d558e2b5cb55a8
    restart: unless-stopped
    command:
      - basic-memory
      - mcp
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - ./mcp/basic-memory/config.env
    volumes:
      - memory-data:/app/data
      - memory-config:/home/appuser/.basic-memory
    networks:
      - pi-backend
  mcp-kubernetes:
    image: ghcr.io/containers/kubernetes-mcp-server:v0.1.3@sha256:6347155616c49c78512114500688b50d275ddde7597b6a38cefe6f40a8c42c16
    restart: unless-stopped
    command:
      - --config
      - /etc/kubernetes-mcp-server/config.toml
    volumes:
      - ./mcp/kubernetes/config.toml:/etc/kubernetes-mcp-server/config.toml:ro
      - ${HOME}/.kube/config:/secrets/kubeconfig:ro
    networks:
      - pi-backend
    security_opt:
      - no-new-privileges:true
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:0.24.8@sha256:a62b1725c31ef2ac50074eb8b1dac88f9167fa56901b2dfa0a45414225e3431b
    restart: unless-stopped
    command:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - ./secrets/atlassian.env
      - ./mcp/atlassian/config.env
    networks:
      - pi-backend
    security_opt:
      - no-new-privileges:true
  mcp-argocd:
    image: ghcr.io/argoproj-labs/mcp-for-argocd:0.9.0@sha256:dffc6c719d8635be2d5f2c8ad1c0178540325da4b40da0b373307e12b4c48f86
    restart: unless-stopped
    command:
      - http
      - --allow-unauthenticated
    env_file:
      - ./secrets/argocd.env
      - ./mcp/argocd/config.env
    networks:
      - pi-backend
    security_opt:
      - no-new-privileges:true
  pi:
    image: ghcr.io/f4z3r/pi-agent-image:latest@sha256:d62af7404bf6dab631ea49a3a1bf8d5aa0267386c5d71d241351fd5b7cf28238
    userns_mode: "keep-id:uid=1000,gid=1000"
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - label=disable
    profiles:
      - agent
    stdin_open: true
    environment: {}
    # HTTP_PROXY: http://egress-proxy:3128
    # HTTPS_PROXY: http://egress-proxy:3128
    # NO_PROXY: agentgateway
    tty: true
    working_dir: /home/f4z3r/workspace/${PI_PROJECT_NAME:-default}
    command: ["pi"]
    volumes:
      - ${PI_WORKSPACE:-./workspace}:/home/f4z3r/workspace/${PI_PROJECT_NAME:-default}
      - pi-state:/home/f4z3r/.pi/agent
      - ./sandbox/config/models.json:/home/f4z3r/.pi/agent/models.json:ro
      - ./sandbox/config/mcp.json:/home/f4z3r/.pi/agent/mcp.json:ro
      - ./sandbox/config/settings.json:/home/f4z3r/.pi/agent/settings.json
      - ./sandbox/config/keybindings.json:/home/f4z3r/.pi/agent/keybindings.json:ro
      - ./sandbox/config/AGENTS.md:/home/f4z3r/.pi/agent/AGENTS.md:ro
      - ./sandbox/config/skills/:/home/f4z3r/.pi/agent/skills/:ro
      - ./sandbox/config/prompts/:/home/f4z3r/.pi/agent/prompts/:ro
      - mise-data:/home/f4z3r/.local/share/mise
    networks:
      - pi-control
      - pi-egress
networks:
  pi-control:
    internal: true
  pi-egress: {}
  pi-backend: {}
volumes:
  pi-state: {}
  mise-data: {}
  agentgateway-data: {}
  memory-data: {}
  memory-config: {}
