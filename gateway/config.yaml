# yaml-language-server: $schema=https://agentgateway.dev/schema/config
gateways:
  default:
    port: 4000
  ui-gateway:
    port: 4001
ui:
  gateways:
    - ui-gateway
config:
  storage:
    mode: readOnly
  database:
    url: sqlite:///data/data.db
llm:
  models:
    - name: "*"
      provider: openrouter
      params:
        apiKey: $OPENROUTER_API_KEY
  policies:
    cors:
      allowOrigins:
        - http://localhost:4001
      allowHeaders:
        - "*"
      allowMethods:
        - GET
        - POST
mcp:
  policies:
    mcpAuthorization:
      rules:
        - allow: >
            mcp.tool.target == "kubernetes" && mcp.tool.name in [
              // general: NEVER allow to create, update, or delete resources
              "configuration_contexts_list", // config: allow getting contexts, do not allow reading config
              "events_list",                 // core: allow to list events for debugging
              "namespaces_list",             // core: allow to list namespaces for discovery
              "projects_list",               // core: allow to list projects for discovery
              "pods_list",                   // core: allow to list pods for discovery
              "pods_list_in_namespace",      // core: allow to list pods for discovery
              "pods_get",                    // core: allow to list pods for discovery
              "pods_top",                    // core: allow to top pods for debugging
              "pods_log",                    // core: allow to get logs from pods for debugging
              "resources_list",              // core: allow to list resources for discovery
              "resources_get",               // core: allow to list resources for discovery
              "api_resources_list",          // core: allow to list resource APIs for discovery
              "helm_list",                   // helm: allow to list helm installs for discovery
              "tekton_pipelinerun_logs",     // tekton: allow to get tekton logs for debugging
              "tekton_pipelinerun_diagnose", // tekton: allow to get tekton logs for debugging
              "tekton_taskrun_logs",         // tekton: allow to get tekton logs for debugging
            ]

    cors:
      allowOrigins:
        - http://localhost:4001
      allowHeaders:
        - "*"
      allowMethods:
        - GET
        - POST
      exposeHeaders:
        - Mcp-Session-Id
  targets:
    - name: kubernetes
      mcp:
        host: http://mcp-kubernetes:8080/mcp
